projects:
  latus:
    schemaPath: amplify/backend/api/latus/build/schema.graphql
    includes:
      - src/graphql/**/*.ts
    excludes:
      - ./amplify/**
      - src/API.ts
    extensions:
      amplify:
        codeGenTarget: typescript
        generatedFileName: src/API.ts
        docsFilePath: src/graphql
        region: ca-central-1
        apiId: null
        maxDepth: 4
extensions:
  amplify:
    version: 3
