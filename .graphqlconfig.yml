projects:
  latus-prod:
    schemaPath: src/graphql/schema.json
    includes:
      - src/graphql/**/*.ts
    excludes:
      - ./amplify/**
      - src/API.ts
    extensions:
      amplify:
        codeGenTarget: typescript
        generatedFileName: src/API.ts
        docsFilePath: src/graphql
        region: ca-central-1
        apiId: zsuut36mtbgidh2fhriwwc7dni
        maxDepth: 4
extensions:
  amplify:
    version: 3
